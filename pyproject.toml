[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fusedate"
version = "0.1.0"
description = "Find dated time bombs in a repo (TODO-by-date comments, config expiry keys, checked-in certs, EOL runtimes) on one timeline, with an .ics export."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Md Rashedul Hasan"}]

[project.scripts]
fusedate = "fusedate.cli:main"

[tool.setuptools]
packages = ["fusedate"]
